name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate live custom snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, html
          from datetime import date

          token = os.environ['GH_TOKEN']
          user = os.environ['GITHUB_REPOSITORY_OWNER']

          query = '''query($login:String!){ user(login:$login){ contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount contributionLevel } } } } } }'''
          payload = json.dumps({'query': query, 'variables': {'login': user}}).encode()
          req = urllib.request.Request(
              'https://api.github.com/graphql', data=payload,
              headers={'Authorization': f'bearer {token}', 'Content-Type': 'application/json', 'User-Agent': 'github-actions'}
          )
          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          weeks = data['data']['user']['contributionsCollection']['contributionCalendar']['weeks']
          days = [d for w in weeks for d in w['contributionDays']]
          total = sum(d['contributionCount'] for d in days)

          # Longest and current contribution streak, from real GitHub data.
          longest = current = 0
          run = 0
          for d in days:
              if d['contributionCount'] > 0:
                  run += 1
                  longest = max(longest, run)
              else:
                  run = 0
          for d in reversed(days):
              if d['contributionCount'] > 0:
                  current += 1
              else:
                  break

          levels = {'NONE':0, 'FIRST_QUARTILE':1, 'SECOND_QUARTILE':2, 'THIRD_QUARTILE':3, 'FOURTH_QUARTILE':4}
          # 52 columns x 7 rows. GitHub's calendar is week-major; pad the first week.
          grid = [[0 for _ in range(52)] for _ in range(7)]
          counts = [[0 for _ in range(52)] for _ in range(7)]
          for x, w in enumerate(weeks[-52:]):
              for y, d in enumerate(w['contributionDays']):
                  if y < 7 and x < 52:
                      grid[y][x] = levels.get(d['contributionLevel'], 0)
                      counts[y][x] = d['contributionCount']

          # Build a snake path through contribution cells in chronological order.
          points = []
          for x in range(52):
              ys = range(7) if x % 2 == 0 else range(6, -1, -1)
              for y in ys:
                  if counts[y][x] > 0:
                      points.append((x, y))
          if not points:
              points = [(0, 3)]

          cell = 14
          gap = 3
          step = cell + gap
          ox, oy = 28, 24
          def center(x,y): return (ox + x*step + cell/2, oy + y*step + cell/2)
          path = ' '.join(('M' if i==0 else 'L') + f'{center(x,y)[0]:.1f},{center(x,y)[1]:.1f}' for i,(x,y) in enumerate(points))
          headx, heady = center(*points[-1])
          # Apple sits a few cells before the head, at the most recent non-head contribution cell.
          appx, appy = center(*(points[-2] if len(points)>1 else points[-1]))

          W, H = 52*step + 56, 7*step + 112
          esc = html.escape(user)
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}">
          <rect width="100%" height="100%" rx="14" fill="#070b10"/>
          <style>
            .cell{{rx:3;}}
            .snake{{fill:none;stroke:#32d74b;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 4;animation:move 7s linear infinite;filter:drop-shadow(0 0 3px #32d74b)}}
            @keyframes move{{to{{stroke-dashoffset:-140}}}}
            .head{{fill:#32d74b;stroke:#0b1117;stroke-width:2}}
            .eye{{fill:#fff}} .pupil{{fill:#111}}
          </style>
          <text x="28" y="18" fill="#d7dee8" font-family="Arial,sans-serif" font-size="14" font-weight="700">Contribution snake</text>
          <g>'''
          colors = ['#161b22','#9be9a8','#40c463','#30a14e','#216e39']
          for x in range(52):
              for y in range(7):
                  c = colors[grid[y][x]]
                  svg += f'<rect class="cell" x="{ox+x*step}" y="{oy+y*step}" width="{cell}" height="{cell}" fill="{c}"/>'
          svg += f'''</g>
          <path class="snake" d="{path}"/>
          <circle class="head" cx="{headx:.1f}" cy="{heady:.1f}" r="8"/>
          <circle class="eye" cx="{headx-3:.1f}" cy="{heady-3:.1f}" r="2.8"/><circle class="eye" cx="{headx+3:.1f}" cy="{heady-3:.1f}" r="2.8"/>
          <circle class="pupil" cx="{headx-3:.1f}" cy="{heady-3:.1f}" r="1.2"/><circle class="pupil" cx="{headx+3:.1f}" cy="{heady-3:.1f}" r="1.2"/>
          <text x="{appx-8:.1f}" y="{appy-10:.1f}" font-size="20">🍎</text>
          <text x="{W/2:.1f}" y="{H-30}" text-anchor="middle" fill="#d7dee8" font-family="Arial,sans-serif" font-size="15">✨ Longest streak: <tspan fill="#32d74b" font-weight="700">{longest} days</tspan></text>
          <text x="{W/2:.1f}" y="{H-10}" text-anchor="middle" fill="#7d8590" font-family="Arial,sans-serif" font-size="11">{total} contributions • live from GitHub</text>
          </svg>'''
          os.makedirs('dist', exist_ok=True)
          open('dist/github-snake.svg','w').write(svg)
          open('dist/github-snake-dark.svg','w').write(svg)
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
